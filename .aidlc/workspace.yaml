name: WorkChatFeatureFactory
version: "2.0"

agents:

  - id: ba-analyze
    name: BA Analyze
    skill: ba-analyze
    model: claude-opus-4-7
    position: Business Analyst
    description: Analyze business requirements and convert to WorkChat Android-ready specs.
    artifact: output/BA-SPEC.md

  - id: solution-design
    name: Solution Design
    skill: solution-design
    model: claude-opus-4-7
    position: Android Architect
    description: Design Android architecture and technical solution aligned with WorkChat modules.
    artifact: output/SOLUTION-DESIGN.md

  - id: planning
    name: Planning
    skill: planning
    model: claude-sonnet-4-6
    position: Tech Lead
    description: Break feature into implementation tasks with module impact analysis.
    artifact: output/IMPLEMENT-PLAN.md

  - id: android-dev
    name: Android Developer
    skill: android-dev
    model: claude-sonnet-4-6
    position: Senior Android Developer
    description: Implement Android feature following WorkChat conventions (Koin, Clean Arch, Coroutines+Flow).
    artifact: output/feature/

  - id: unit-test
    name: Unit Test
    skill: unit-test
    model: claude-sonnet-4-6
    position: QA Automation Engineer
    description: Write and run unit tests for ViewModel, UseCase, and Repository layers.
    artifact: output/UNIT-TEST-REPORT.md

  - id: code-review
    name: Code Review
    skill: code-review
    model: claude-opus-4-7
    position: Principal Android Engineer
    description: Review architecture, code quality, and WorkChat-specific conventions.
    artifact: output/CODE-REVIEW.md

  - id: integration-test
    name: Integration Test
    skill: integration-test
    model: claude-sonnet-4-6
    position: QA Engineer
    description: Generate integration test plan and validate logic against UAT environment specs.
    artifact: output/INTEGRATION-TEST.md

  - id: release-check
    name: Release Check
    skill: release-check
    model: claude-sonnet-4-6
    position: Release Manager
    description: Validate release readiness across dev/uat/stag/prod flavors. Requires manual Crashlytics data.
    artifact: output/RELEASE-NOTE.md

  - id: dev-check
    name: Dev Check
    skill: dev-check
    model: claude-sonnet-4-6
    position: Senior Android Developer
    description: Pre-PR self-review — flavor safety, Koin DI, coroutine correctness, Room migrations, debug artifacts, PR hygiene.
    artifact: output/DEV-CHECK.md

  - id: figma-inspect
    name: Figma Inspect
    skill: figma-inspect
    model: claude-sonnet-4-6
    position: Senior Android UI Engineer
    description: Read a Figma URL via MCP, extract design tokens and component structure, produce an Android Compose implementation spec.
    artifact: output/FIGMA-SPEC.md

skills:
  - id: ba-analyze
    path: ./.aidlc/skills/ba-analyze.md

  - id: solution-design
    path: ./.aidlc/skills/solution-design.md

  - id: planning
    path: ./.aidlc/skills/planning.md

  - id: android-dev
    path: ./.aidlc/skills/android-dev.md

  - id: unit-test
    path: ./.aidlc/skills/unit-test.md

  - id: code-review
    path: ./.aidlc/skills/code-review.md

  - id: integration-test
    path: ./.aidlc/skills/integration-test.md

  - id: release-check
    path: ./.aidlc/skills/release-check.md

  - id: dev-check
    path: ./.aidlc/skills/dev-check.md

  - id: figma-inspect
    path: ./.aidlc/skills/figma-inspect.md

environment:
  project_type: android
  language: kotlin
  architecture: clean-architecture
  ui_framework: compose-xml-hybrid
  di_framework: koin
  min_sdk: 28
  target_sdk: 35
  modules:
    - app
    - workchat
    - callsdk
    - network

slash_commands:
  - name: /plan
    agent: ba-analyze

  - name: /design
    agent: solution-design

  - name: /task
    agent: planning

  - name: /implement
    agent: android-dev

  - name: /ut
    agent: unit-test

  - name: /workchat-review
    agent: code-review

  - name: /it
    agent: integration-test

  - name: /release
    agent: release-check

  - name: /figma
    agent: figma-inspect

  - name: /dev
    agent: dev-check

  - name: /vibe
    agent: solution-design

pipelines:

  # Full feature delivery — BA spec through release
  - id: workchat-feature-flow
    name: WorkChat Feature Delivery Flow
    steps:

      - agent: ba-analyze
        enabled: true
        requires: []
        produces:
          - output/BA-SPEC.md
        human_review: true
        auto_review: false

      - agent: solution-design
        enabled: true
        requires:
          - output/BA-SPEC.md
        produces:
          - output/SOLUTION-DESIGN.md
        human_review: true
        auto_review: false

      - agent: planning
        enabled: true
        requires:
          - output/SOLUTION-DESIGN.md
        produces:
          - output/IMPLEMENT-PLAN.md
        human_review: false
        auto_review: false

      - agent: android-dev
        enabled: true
        requires:
          - output/IMPLEMENT-PLAN.md
        produces:
          - output/feature/
        human_review: false
        auto_review: false

      - agent: unit-test
        enabled: true
        requires:
          - output/feature/
        produces:
          - output/UNIT-TEST-REPORT.md
        human_review: false
        auto_review: true

      - agent: code-review
        enabled: true
        requires:
          - output/feature/
          - output/UNIT-TEST-REPORT.md
        produces:
          - output/CODE-REVIEW.md
        human_review: true
        auto_review: false

      - agent: integration-test
        enabled: true
        requires:
          - output/CODE-REVIEW.md
        produces:
          - output/INTEGRATION-TEST.md
        human_review: false
        auto_review: true

      - agent: release-check
        enabled: true
        requires:
          - output/INTEGRATION-TEST.md
          - output/CODE-REVIEW.md
        produces:
          - output/RELEASE-NOTE.md
        human_review: true
        auto_review: false

    on_failure: stop

  # Hotfix / small change — skip BA and integration steps
  - id: workchat-hotfix-flow
    name: WorkChat Hotfix Flow
    steps:

      - agent: solution-design
        enabled: true
        requires: []
        produces:
          - output/SOLUTION-DESIGN.md
        human_review: false
        auto_review: false

      - agent: android-dev
        enabled: true
        requires:
          - output/SOLUTION-DESIGN.md
        produces:
          - output/feature/
        human_review: false
        auto_review: false

      - agent: unit-test
        enabled: true
        requires:
          - output/feature/
        produces:
          - output/UNIT-TEST-REPORT.md
        human_review: false
        auto_review: true

      - agent: code-review
        enabled: true
        requires:
          - output/feature/
          - output/UNIT-TEST-REPORT.md
        produces:
          - output/CODE-REVIEW.md
        human_review: true
        auto_review: false

    on_failure: stop

  # Developer daily loop — ticket to PR-ready, no BA or release steps
  - id: workchat-dev-flow
    name: WorkChat Developer Daily Flow
    steps:

      - agent: planning
        enabled: true
        requires: []
        produces:
          - output/IMPLEMENT-PLAN.md
        human_review: false
        auto_review: false

      - agent: android-dev
        enabled: true
        requires:
          - output/IMPLEMENT-PLAN.md
        produces:
          - output/feature/
        human_review: false
        auto_review: false

      - agent: unit-test
        enabled: true
        requires:
          - output/feature/
        produces:
          - output/UNIT-TEST-REPORT.md
        human_review: false
        auto_review: true

      - agent: code-review
        enabled: true
        requires:
          - output/feature/
          - output/UNIT-TEST-REPORT.md
        produces:
          - output/CODE-REVIEW.md
        human_review: false
        auto_review: true

      - agent: dev-check
        enabled: true
        requires:
          - output/feature/
          - output/UNIT-TEST-REPORT.md
          - output/CODE-REVIEW.md
        produces:
          - output/DEV-CHECK.md
        human_review: false
        auto_review: false

    on_failure: stop

  # Screen development with Figma design — Figma inspect drives the implementation
  - id: workchat-dev-figma-flow
    name: WorkChat Screen Dev with Figma
    steps:

      - agent: figma-inspect
        enabled: true
        requires: []
        produces:
          - output/FIGMA-SPEC.md
        human_review: false
        auto_review: false

      - agent: planning
        enabled: true
        requires:
          - output/FIGMA-SPEC.md
        produces:
          - output/IMPLEMENT-PLAN.md
        human_review: false
        auto_review: false

      - agent: android-dev
        enabled: true
        requires:
          - output/FIGMA-SPEC.md
          - output/IMPLEMENT-PLAN.md
        produces:
          - output/feature/
        human_review: false
        auto_review: false

      - agent: unit-test
        enabled: true
        requires:
          - output/feature/
        produces:
          - output/UNIT-TEST-REPORT.md
        human_review: false
        auto_review: true

      - agent: code-review
        enabled: true
        requires:
          - output/feature/
          - output/UNIT-TEST-REPORT.md
        produces:
          - output/CODE-REVIEW.md
        human_review: false
        auto_review: true

      - agent: dev-check
        enabled: true
        requires:
          - output/feature/
          - output/UNIT-TEST-REPORT.md
          - output/CODE-REVIEW.md
        produces:
          - output/DEV-CHECK.md
        human_review: false
        auto_review: false

    on_failure: stop

  # Vibe flow — BA-SPEC.md already exists, go straight to solution → code → done
  # Zero human gates: fully autonomous from solution design to PR-ready
  - id: workchat-vibe-flow
    name: WorkChat Vibe Coding Flow
    steps:

      - agent: solution-design
        enabled: true
        requires:
          - output/BA-SPEC.md
        produces:
          - output/SOLUTION-DESIGN.md
        human_review: false
        auto_review: false

      - agent: planning
        enabled: true
        requires:
          - output/SOLUTION-DESIGN.md
        produces:
          - output/IMPLEMENT-PLAN.md
        human_review: false
        auto_review: false

      - agent: android-dev
        enabled: true
        requires:
          - output/IMPLEMENT-PLAN.md
        produces:
          - output/feature/
        human_review: false
        auto_review: false

      - agent: unit-test
        enabled: true
        requires:
          - output/feature/
        produces:
          - output/UNIT-TEST-REPORT.md
        human_review: false
        auto_review: true

      - agent: code-review
        enabled: true
        requires:
          - output/feature/
          - output/UNIT-TEST-REPORT.md
        produces:
          - output/CODE-REVIEW.md
        human_review: false
        auto_review: true

      - agent: dev-check
        enabled: true
        requires:
          - output/feature/
          - output/UNIT-TEST-REPORT.md
          - output/CODE-REVIEW.md
        produces:
          - output/DEV-CHECK.md
        human_review: false
        auto_review: false

    on_failure: stop

  # Vibe flow with Figma — same as vibe-flow but figma-inspect runs after solution-design
  # Use when you have both a BA-SPEC.md and a Figma design URL
  - id: workchat-vibe-figma-flow
    name: WorkChat Vibe Coding Flow (with Figma)
    steps:

      - agent: solution-design
        enabled: true
        requires:
          - output/BA-SPEC.md
        produces:
          - output/SOLUTION-DESIGN.md
        human_review: false
        auto_review: false

      - agent: figma-inspect
        enabled: true
        requires:
          - output/SOLUTION-DESIGN.md
        produces:
          - output/FIGMA-SPEC.md
        human_review: false
        auto_review: false

      - agent: planning
        enabled: true
        requires:
          - output/SOLUTION-DESIGN.md
          - output/FIGMA-SPEC.md
        produces:
          - output/IMPLEMENT-PLAN.md
        human_review: false
        auto_review: false

      - agent: android-dev
        enabled: true
        requires:
          - output/IMPLEMENT-PLAN.md
          - output/FIGMA-SPEC.md
        produces:
          - output/feature/
        human_review: false
        auto_review: false

      - agent: unit-test
        enabled: true
        requires:
          - output/feature/
        produces:
          - output/UNIT-TEST-REPORT.md
        human_review: false
        auto_review: true

      - agent: code-review
        enabled: true
        requires:
          - output/feature/
          - output/UNIT-TEST-REPORT.md
        produces:
          - output/CODE-REVIEW.md
        human_review: false
        auto_review: true

      - agent: dev-check
        enabled: true
        requires:
          - output/feature/
          - output/UNIT-TEST-REPORT.md
          - output/CODE-REVIEW.md
        produces:
          - output/DEV-CHECK.md
        human_review: false
        auto_review: false

    on_failure: stop

sidebar:
  views:
    - type: agents-list
    - type: skills-list
    - type: pipelines-list
